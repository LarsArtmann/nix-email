# Gate: nix flake check (eval contract + BOTH NixOS VM tests).
#
# Fail-closed rules (go-paperless lesson: a gate must PROVE it measured):
#   - No `|| true`, no `-no-fail`, no step continues past a failure
#     (GitHub Actions run steps fail on non-zero exit by default).
#   - Before the check runs, the flake's declared check set is compared
#     against CI's expected-checks list and must match EXACTLY (lockstep
#     guard) - a flake that silently stops exporting checks fails here, and
#     so does a new check nobody registered in the expected list.
name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2 (SHA resolved via git ref tags/v4.2.2 - the previously pinned 11bd1966... never existed)

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@21a544727d0c62386e78b4befe52d19ad12692e3 # v17 (SHA resolved via git ref tags/v17)
        with:
          extra-conf: |
            allow-import-from-derivation = true

      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@146f476c94460cb634f9ade79470fcbc3f7e5b36 # v1 (SHA resolved via git ref tags/v1)

      - name: Parse all Nix files
        run: |
          find . -name '*.nix' -print0 | xargs -0 -n1 nix-instantiate --parse > /dev/null

      - name: Enforce alejandra formatting (fail-closed)
        run: nix fmt -- . --check

      - name: Assert CI expected-checks match the flake (lockstep, fail-closed)
        run: |
          # LOCKSTEP GUARD: the flake's declared check set (builtins.attrNames
          # is sorted by definition) and CI's expected list must be EXACTLY
          # equal. Catches BOTH drift directions: a check that vanished from
          # the flake (the gate would silently run less than it claims) AND a
          # check added to the flake but never registered here (its later
          # disappearance would go unnoticed). Update the expected list IN
          # THE SAME COMMIT that adds/removes a check in flake.nix.
          # No pipes on gate commands (repo rule): nix eval writes a file,
          # jq reads the file; any upstream failure fails the step directly.
          nix eval .#checks.x86_64-linux --json --apply 'builtins.attrNames' > /tmp/actual-checks.json
          expected='["dmarc-eval","parsedmarc-e2e","stalwart-e2e","stalwart-relay-e2e"]'
          if ! jq -e --argjson expected "$expected" 'sort == ($expected | sort)' /tmp/actual-checks.json > /dev/null; then
            echo "FATAL: flake checks and CI expected-checks list diverged."
            echo "--- flake declares: $(cat /tmp/actual-checks.json)"
            echo "--- CI expects:     $expected"
            exit 1
          fi

      - name: Assert the aarch64 check set exists (shape guard)
        run: |
          # SHAPE ONLY: attrNames does not force the derivations, so this
          # stays arch-independent (forcing outPath would need to BUILD the
          # aarch64 strip script - "platform mismatch" on the x86_64 runner;
          # the deep eval is verified locally with emulation, 2026-09-15).
          # Catches wiring regressions in the flake's system gating.
          test "$(nix eval .#checks.aarch64-linux --apply 'builtins.attrNames')" = '[ "dmarc-eval" ]'

      - name: Run nix flake check (eval contract + VM tests)
        run: nix flake check --print-build-logs
