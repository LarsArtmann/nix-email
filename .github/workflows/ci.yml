# Gate: nix flake check (eval contract tests + all three VM E2E tests).
#
# Fail-closed rules (go-paperless lesson: a gate must PROVE it measured):
#   - No `|| true`, no `-no-fail`, no step continues past a failure
#     (GitHub Actions run steps fail on non-zero exit by default).
#   - Before the check runs, the flake's declared check set is compared
#     against CI's expected-checks list and must match EXACTLY (lockstep
#     guard) - a flake that silently stops exporting checks fails here, and
#     so does a new check nobody registered in the expected list.
name: CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 (SHA resolved via git ref tags/v4.2.2 - the previously pinned 11bd1966... never existed)

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23 (SHA resolved via git ref tags/v17)
        with:
          extra-conf: |
            allow-import-from-derivation = true

      - name: Cache Nix store
        uses: DeterminateSystems/flakehub-cache-action@3ac6f3c19fc52eeb1408fd434bd1b4ed4266bf25 # v3.24.1 (SHA resolved via git ref tags/v1)

      - name: Parse all Nix files
        run: |
          find . -name '*.nix' -print0 | xargs -0 -n1 nix-instantiate --parse > /dev/null

      - name: Lint GitHub Actions workflows (actionlint, fail-closed)
        run: |
          # actionlint catches expression typos (workflow-expression
          # contexts, shell quoting inside run:, matrix shape errors) that
          # YAML parsing cannot. CAUTION (self-bitten 2026-09-16): never
          # write a literal dollar-brace-brace expression in this file's
          # comments - actionlint parses those even in comments and fails
          # on the empty/placeholder form. Registry-pinned nixpkgs on
          # purpose: unlike the flake's locked nixpkgs, the registry tracks
          # current actionlint rules - for a linter, newer rules are the
          # point.
          nix run nixpkgs#actionlint

      - name: Lint Python files (ruff, fail-closed)
        run: |
          # RUFF (the 2026-10-18 incident, mechanized): error-class python
          # lint findings shipped to master through three gate runs because
          # daemon pushes bypass the pre-push hook AND CI had NO python
          # lint step at all (verified 2026-10-18: zero ruff/bandit/vulture
          # invocations in this file before this step landed). Rules are
          # pinned via --select so a newer ruff cannot silently widen the
          # gate; the binary is the LOCKED nixpkgs rev (statix pattern) so
          # any red is reproducible locally. Deeper rule classes
          # (PERF/FURB/BLE) stay owned by buildflow's ruff step - keep this
          # the stable error floor. Self-test first (never-firing-lint
          # doctrine): an unused import MUST fail before the real files run.
          set -eu
          rev="$(nix flake metadata --json . | jq -r '.locks.nodes.nixpkgs.locked.rev')"
          fixture="$(mktemp /tmp/ruff-selftest-XXXXXX.py)"
          # Deferred expansion is intentional (fixture path fixed at set
          # time anyway); shellcheck's SC2016 fires on the quoted form.
          # shellcheck disable=SC2016
          trap 'rm -f "$fixture"' EXIT
          printf 'import os\nprint("x")\n' > "$fixture"
          if nix run "github:NixOS/nixpkgs/$rev#ruff" -- check --select E4,E7,E9,F --output-format concise "$fixture" > /dev/null 2>&1; then
            echo "FATAL: ruff step accepted an unused import (never-firing lint)"
            exit 1
          fi
          git ls-files -z '*.py' > /tmp/py-files.list
          xargs -0 -r nix run "github:NixOS/nixpkgs/$rev#ruff" -- check --select E4,E7,E9,F --output-format concise < /tmp/py-files.list

      - name: Enforce alejandra formatting (fail-closed)
        run: nix fmt -- . --check

      - name: Lint markdown tables for unescaped pipes (fail-closed, self-tested)
        run: |
          # TABLE PIPE LINT (the 2026-09-23 eaten-rows lesson, mechanized):
          # dprint re-splits markdown table rows on UNESCAPED pipes and
          # DROPS overflow cells when a row has more than its header - two
          # status-report rows were silently eaten that way. Every row must
          # match its header's unescaped-pipe count; literal pipes in a
          # cell MUST be escaped as `\|`. The step self-tests the lint on
          # planted fixtures first (the gawk \b lesson: a never-firing
          # lint is a false green - negative tests are mandatory).
          set -eu
          fixture="$(mktemp /tmp/pipe-lint-XXXXXX.md)"
          # Deferred expansion is intentional (fixture path fixed at set
          # time anyway); shellcheck's SC2016 fires on the quoted form.
          # shellcheck disable=SC2016
          trap 'rm -f "$fixture"' EXIT
          # 1) fewer cells than header -> must FAIL
          printf '| a | b | c |\n| --- | --- | --- |\n| 1 | 2 |\n' > "$fixture"
          if bash scripts/check-md-table-pipes.sh "$fixture" > /dev/null 2>&1; then
            echo "FATAL: lint accepted a row with fewer cells than its header"; exit 1
          fi
          # 2) the eaten-rows class: more cells than header -> must FAIL
          printf '| a | b | c |\n| --- | --- | --- |\n| 1 | 2 | 3 | 4 |\n' > "$fixture"
          if bash scripts/check-md-table-pipes.sh "$fixture" > /dev/null 2>&1; then
            echo "FATAL: lint accepted a row with more cells than its header"; exit 1
          fi
          # 3) escaped pipe -> must PASS
          printf '| a | b | c |\n| --- | --- | --- |\n| 1 \\| x | 2 | 3 |\n' > "$fixture"
          if ! bash scripts/check-md-table-pipes.sh "$fixture" > /dev/null 2>&1; then
            echo "FATAL: lint flagged an escaped pipe"; exit 1
          fi
          # 4) pipes inside a code fence -> must PASS
          cat > "$fixture" <<'FENCEEOF'
          text
          ```sh
          | not | a | table |
          ```
          | a | b | c |
          | 1 | 2 | 3 |
          FENCEEOF
          if ! bash scripts/check-md-table-pipes.sh "$fixture" > /dev/null 2>&1; then
            echo "FATAL: lint flagged pipes inside a code fence"; exit 1
          fi
          git ls-files -z '*.md' > /tmp/md-files.list
          xargs -0 bash scripts/check-md-table-pipes.sh < /tmp/md-files.list

      - name: Lint prose-wrap list markers (fail-closed, self-tested)
        run: |
          # LIST-MARKER LINT (the dprint rewrap incidents, mechanized and
          # empirically scoped 2026-10-19): a list marker directly after a
          # column-0 prose line is the one list-adjacency shape dprint
          # normalizes (it inserts the blank line itself) - in a formatted
          # tree that means unfresh formatting or a mistyped wrap. Wrapped
          # items, siblings, and nested lists are dprint-stable shapes and
          # are NOT flagged (verified against dprint behavior). Negative
          # fixtures first: a never-firing lint is a false green.
          set -eu
          fixture="$(mktemp /tmp/marker-lint-XXXXXX.md)"
          trap 'rm -f "$fixture"' EXIT
          printf 'prose line that wraps\n- and the wrap lands on a marker\n' > "$fixture"
          if bash scripts/check-md-list-markers.sh "$fixture" > /dev/null 2>&1; then
            echo "FATAL: lint accepted a marker directly after prose"; exit 1
          fi
          printf 'prose\n\n- item\n  - nested\n- sibling after wrap\n  continues\n- next\n' > "$fixture"
          if ! bash scripts/check-md-list-markers.sh "$fixture" > /dev/null 2>&1; then
            echo "FATAL: lint flagged a deliberate list shape"; exit 1
          fi
          git ls-files -z '*.md' > /tmp/md-files2.list
          xargs -0 bash scripts/check-md-list-markers.sh < /tmp/md-files2.list

      - name: Check-set drift alarm (fail-closed, self-tested)
        run: |
          # DRIFT ALARM (the 6->7 count rot, mechanized): AGENTS.md and
          # README.md must not carry NUMERIC check-set claims ("9-check
          # set", "the 7 checks") - counts rot within hours. The canonical
          # set lives in the ci.yml lockstep lists + scripts/check-inventory.sh;
          # README "What is built and verified" names checks individually.
          set -eu
          fixture="$(mktemp /tmp/drift-lint-XXXXXX.md)"
          trap 'rm -f "$fixture"' EXIT
          printf 'the 9-check set is green\n' > "$fixture"
          if bash scripts/check-check-set-drift.sh "$fixture" > /dev/null 2>&1; then
            echo "FATAL: drift alarm accepted a numeric check-set claim"; exit 1
          fi
          printf 'the canonical check list lives in ci.yml\n' > "$fixture"
          if ! bash scripts/check-check-set-drift.sh "$fixture" > /dev/null 2>&1; then
            echo "FATAL: drift alarm flagged a clean line"; exit 1
          fi
          bash scripts/check-check-set-drift.sh AGENTS.md README.md

      - name: Assert README names every flake check (anti-drift)
        run: |
          # Completeness side of the drift alarm: every LIVE check name
          # must appear in README (its "What is built and verified" section
          # owns the prose restatement; the ci.yml lockstep step owns the
          # canonical machine list). A check that ships without README
          # prose rots silently.
          set -eu
          names="$(nix eval .#checks.x86_64-linux --json --apply 'builtins.attrNames')"
          for name in $(echo "$names" | jq -r '.[]'); do
            if ! grep -q "$name" README.md; then
              echo "FATAL: check '$name' is not named in README.md (the canonical prose restatement)"; exit 1
            fi
          done
          echo "README names all $(echo "$names" | jq -r '. | length') checks"

      - name: Statix lint Nix files (fail-closed)
        run: |
          # STATIX: structural nix warnings (W20-class collapses ship as
          # deliberate styles here - the pinned statix must be the SAME
          # rev the repo pins, so findings are reproducible locally:
          # `nix run github:NixOS/nixpkgs/$(nix flake metadata --json . |
          # jq -r .locks.nodes.nixpkgs.locked.rev)#statix -- check .`).
          rev="$(nix flake metadata --json . | jq -r '.locks.nodes.nixpkgs.locked.rev')"
          nix run "github:NixOS/nixpkgs/$rev#statix" -- check .

      - name: Ban piped grep/tail/head assertions in tests (fail-closed)
        run: |
          # PIPE LINT (the exit-23 lesson, mechanized): in-VM assertions must
          # be dump-to-file + grep-the-file, never `producer | grep -q`.
          # Under the test shell's pipefail, grep -q's early exit EPIPEs the
          # producer (observed ONCE in CI as curl exit 23 on a MATCHING
          # payload, 2026-09-15); the negated form `! p | grep -q` can
          # phantom-green. `| tail`/`| head` are the same class (exit-code
          # eating / early close). Comment lines (nix or embedded python) are
          # exempt so the doctrine can be stated in comments.
          # No pipes on gate commands: a single awk prints offenders and sets
          # the exit status; any hit fails the step. NOTE: the word boundary
          # is ([^[:alnum:]]|$), NOT \b - gawk 5.x regex constants treat \b as
          # backspace, which makes the lint a never-firing false green
          # (caught by the 2026-09-16 local negative test).
          awk 'match($0, /\|[[:space:]]*!?[[:space:]]*(grep|tail|head)([^[:alnum:]]|$)/) && $0 !~ /^[[:space:]]*#/ {printf "offender: %s:%d: %s\n", FILENAME, FNR, $0; bad=1} END {exit bad}' tests/*.nix

      - name: Lint VM-testScript shell fragments (fail-closed, self-tested)
        run: |
          # TESTSCRIPT SHELL LINT (the 28e5dd7 unclosed-brace lesson,
          # mechanized): testScript shell commands are Python string
          # constants inside a Nix indented string, so nix eval, alejandra
          # and the awk pipe lint all pass them. An unbalanced brace group
          # only surfaces when bash runs it in the VM. The script extracts
          # every testScript, folds implicit string concatenation with
          # Python's ast, and runs `bash -n` on each constant argument.
          # Self-test first (never-firing-lint doctrine): the 28e5dd7 broken
          # shape MUST fail and the closed shape MUST pass before the real
          # tree is checked, and zero extracted fragments is itself a fail.
          python3 scripts/check-testscript-shell.py --self-test
          python3 scripts/check-testscript-shell.py

      - name: Assert CI expected-checks match the flake (lockstep, fail-closed)
        run: |
          # LOCKSTEP GUARD: the flake's declared check set (builtins.attrNames
          # is sorted by definition) and the canonical expected list must be
          # EXACTLY equal. Catches BOTH drift directions: a check that vanished
          # from the flake (the gate would silently run less than it claims)
          # AND a check added to the flake but never registered. The expected
          # list lives in tests/check-expected.json - the SINGLE source also
          # read by scripts/check-inventory.sh and the check-set-lockstep
          # flake check, so a check add/remove edits one list, not four.
          # No pipes on gate commands (repo rule): nix eval writes a file,
          # jq reads the file; any upstream failure fails the step directly.
          nix eval .#checks.x86_64-linux --json --apply 'builtins.attrNames' > /tmp/actual-checks.json
          expected="$(jq -c '.["x86_64-linux"]' tests/check-expected.json)"
          if ! jq -e --argjson expected "$expected" 'sort == ($expected | sort)' /tmp/actual-checks.json > /dev/null; then
            echo "FATAL: flake checks and CI expected-checks list diverged."
            echo "--- flake declares: $(cat /tmp/actual-checks.json)"
            echo "--- CI expects:     $expected"
            exit 1
          fi

      - name: Assert the aarch64 check set exists (shape guard)
        run: |
          # SHAPE ONLY: attrNames does not force the derivations, so this
          # stays arch-independent (forcing outPath would need to BUILD the
          # aarch64 strip script - "platform mismatch" on the x86_64 runner;
          # the deep eval is verified locally with emulation, 2026-09-15).
          # Catches wiring regressions in the flake's system gating. The
          # expected shape comes from tests/check-expected.json (single
          # source, same file the lockstep step reads).
          nix eval .#checks.aarch64-linux --json --apply 'builtins.attrNames' > /tmp/actual-aarch64.json
          if ! jq -e --slurpfile expected tests/check-expected.json 'sort == ($expected[0]["aarch64-linux"] | sort)' /tmp/actual-aarch64.json > /dev/null; then
            echo "FATAL: aarch64 check set drifted from tests/check-expected.json."
            echo "--- flake declares: $(cat /tmp/actual-aarch64.json)"
            echo "--- expected:       $(jq -c '.["aarch64-linux"]' tests/check-expected.json)"
            exit 1
          fi

      - name: Run nix flake check (eval contract + VM tests)
        run: nix flake check --print-build-logs
