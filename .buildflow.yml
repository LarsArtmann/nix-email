# BuildFlow project config - non-default information ONLY (restating
# defaults is a fleet anti-pattern; unknown keys warn at every load).
# Canonical keys: BuildFlow skill references/commands.md.
# Telemetry opt-out (verified in the binary env surface, 2026-10-19):
# BUILDFLOW_TELEMETRY_DISABLED=1
#
# Per-step ceiling: the VM E2E checks build a full NixOS image and a
# cold nix-build exceeds BuildFlow's per-tool deadline, so the full gate
# used to require `--step-timeout nix-build=25m` from memory on every
# invocation. The 2026-10-23 binary (3509b30) has NO config map for per-tool
# timeouts - `step_timeouts:` is rejected as an unknown key (verified
# 2026-10-23 via `buildflow config lint`) - so the durable form is the
# documented global key at the same 25m budget. Pair with
# `--max-time 30m` (or more) on the invocation.
default_step_timeout: 25m
# Frozen probe transcripts under docs/probes/ are RUN EVIDENCE, not
# maintained code: successive probe sets legitimately share their harness
# (carddav 2026-10-19 vs caldav 2026-10-29), and reformatting or
# deduplicating them would falsify recorded evidence. The maintained
# Python surface is scripts/ + modules/ + tests/ - all still scanned.
exclude:
  - docs/probes/**
skip_steps:
  # jscpd has NO per-tool path exclusion (a `tool_options: {jscpd: ...}`
  # guess was silently inert, 2026-10-30) and does not honor the global
  # `exclude:` - its only findings here are the frozen probe-transcript
  # harness overlap under docs/probes/ (the 58-line carddav/caldav ERROR
  # that redened the 2026-10-30 gate). Maintained-code duplication stays
  # owned by the deduplicate-code doctrine via art-dupl. Re-enable when
  # BuildFlow ships per-tool excludes or jscpd respects `exclude:`
  # (their-repo follow-up, TODO_LIST BuildFlow row).
  - jscpd
  # vulnix crashes fleet-wide updating the NVD feed: HTTP 404 on
  # nvdcve-2.0-modified.json.gz (NVD retired the legacy JSON 2.0 feeds;
  # vulnix 1.12.5 is unmaintained upstream). BuildFlow's "unscannable
  # store path" hint misdiagnoses this. Re-enable when BuildFlow ships a
  # CVE scanner that works.
  - vulnix
  # No pytest suite exists - all tests are NixOS VM tests in tests/*.nix;
  # pytest reports its own "collected 0 items" banner as findings noise.
  - pytest-test
  # Docstring-coverage on the procedural ops/probe scripts (host-parse
  # fixture runner, generators, vendored migration script) is noise: they
  # are deliberately flat CLIs, and the tool is not in the devShell on
  # purpose (minimal shell), so its only local effect is the
  # "not installed" preflight WARN.
  - interrogate
  # Real Python exists now (scripts/*.py, vendored migrate_v016.py, probe
  # scripts), but it is untyped procedural tooling by design - mypy on it
  # is the accepted-noise class (bandit/vulture), not signal. The old
  # "only Python is the test-driver template" rationale is retired.
  - mypy-check
